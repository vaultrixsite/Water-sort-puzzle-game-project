    <!-- Win Modal -->
    <div class="modal" id="winModal">
        <div class="modal-content">
            <h2>Level Cleared! 🎉</h2>
            <p>Fantastic job! Ready for the next challenge?</p>
            <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="nextLevel()">Continue</button>
        </div>

    <script>
        const PALETTE = [
            '#ff4757', '#2ed573', '#1e90ff', '#ffa502', 
            '#9b59b6', '#00d2d3', '#ff6b81', '#7bed9f', 
            '#70a1ff', '#eccc68', '#ff7f50', '#a4b0be'
        ];

        let currentLevel = parseInt(localStorage.getItem('water_sort_level')) || 1;
        let tubes = [];
        let historyState = [];
        let selectedTubeIndex = null;
        const TUBE_CAPACITY = 4;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'pour') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.setValueAtTime(450, audioCtx.currentTime + 0.1);
                osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        function generateLevel(levelNum) {
            let colorCount = Math.min(3 + Math.floor(levelNum / 2), PALETTE.length - 2);
            let emptyCount = 2;
            let totalTubes = colorCount + emptyCount;

            let fullTubes = [];
            for (let i = 0; i < colorCount; i++) {
                let tube = [];
                for (let j = 0; j < TUBE_CAPACITY; j++) {
                    tube.push(i);
                }
                fullTubes.push(tube);
            }
            for (let i = 0; i < emptyCount; i++) {
                fullTubes.push([]);
            }

            let shuffleSteps = colorCount * 8 + levelNum * 3;
            let currentGrid = fullTubes.map(t => [...t]);

            for (let step = 0; step < shuffleSteps; step++) {
                let validMoves = [];
                for (let src = 0; src < totalTubes; src++) {
                    if (currentGrid[src].length === 0) continue;
                    for (let dst = 0; dst < totalTubes; dst++) {
                        if (src === dst) continue;
                        if (currentGrid[dst].length < TUBE_CAPACITY) {
                            if (currentGrid[dst].length === 0 || 
                                currentGrid[dst][currentGrid[dst].length - 1] === currentGrid[src][currentGrid[src].length - 1]) {
                                validMoves.push({src, dst});
                            }
                        }
                    }
                }

                if (validMoves.length > 0) {
                    let move = validMoves[Math.floor(Math.random() * validMoves.length)];
                    let color = currentGrid[move.src].pop();
                    currentGrid[move.dst].push(color);
                }
            }

            if (checkIfWon(currentGrid)) {
                return generateLevel(levelNum + 1);
            }

            return currentGrid;
        }

        function initGame() {
            document.getElementById('levelIndicator').innerText = `Level ${currentLevel}`;
            tubes = generateLevel(currentLevel);
            historyState = [];
            selectedTubeIndex = null;
            document.getElementById('winModal').classList.remove('active');
            renderBoard();
        }

        function renderBoard() {
            const grid = document.getElementById('tubesGrid');
            grid.innerHTML = '';

            tubes.forEach((tube, index) => {
                const tubeEl = document.createElement('div');
                tubeEl.className = `tube ${selectedTubeIndex === index ? 'selected' : ''}`;
                tubeEl.onclick = () => handleTubeClick(index);

                for (let i = 0; i < TUBE_CAPACITY; i++) {
                    const unit = document.createElement('div');
                    unit.className = 'color-unit';
                    if (i < tube.length) {
                        unit.style.backgroundColor = PALETTE[tube[i]];
                    } else {
                        unit.style.backgroundColor = 'transparent';
                    }
                    tubeEl.appendChild(unit);
                }
                grid.appendChild(tubeEl);
            });
        }

        function handleTubeClick(index) {
            if (selectedTubeIndex === null) {
                if (tubes[index].length > 0) {
                    selectedTubeIndex = index;
                    renderBoard();
                }
            } else {
                if (selectedTubeIndex === index) {
                    selectedTubeIndex = null;
                    renderBoard();
                } else {
                    if (isValidPour(selectedTubeIndex, index)) {
                        saveState();
                        pourWater(selectedTubeIndex, index);
                        selectedTubeIndex = null;
                        renderBoard();
                        playSound('pour');

                        if (checkIfWon(tubes)) {
                            setTimeout(() => {
                                playSound('win');
                                document.getElementById('winModal').classList.add('active');
                            }, 300);
                        }
                    } else {
                        if (tubes[index].length > 0) {
                            selectedTubeIndex = index;
                            renderBoard();
                        } else {
                            selectedTubeIndex = null;
                            renderBoard();
                        }
                    }
                }
            }
        }

        function isValidPour(src, dst) {
            if (tubes[src].length === 0) return false;
            if (tubes[dst].length === TUBE_CAPACITY) return false;
            if (tubes[dst].length === 0) return true;

            let srcTopColor = tubes[src][tubes[src].length - 1];
            let dstTopColor = tubes[dst][tubes[dst].length - 1];

            return srcTopColor === dstTopColor;
        }

        function pourWater(src, dst) {
            let colorToMove = tubes[src][tubes[src].length - 1];
            let count = 0;

            for (let i = tubes[src].length - 1; i >= 0; i--) {
                if (tubes[src][i] === colorToMove) {
                    count++;
                } else {
                    break;
                }
            }

            let spaceAvailable = TUBE_CAPACITY - tubes[dst].length;
            let transferCount = Math.min(count, spaceAvailable);

            for (let i = 0; i < transferCount; i++) {
                tubes[src].pop();
                tubes[dst].push(colorToMove);
            }
        }

        function saveState() {
            historyState.push(tubes.map(t => [...t]));
            if (historyState.length > 10) historyState.shift();
        }

        function undoMove() {
            if (historyState.length > 0) {
                tubes = historyState.pop();
                selectedTubeIndex = null;
                renderBoard();
            }
        }

        function restartLevel() {
            initGame();
        }

        function skipLevel() {
            currentLevel++;
            localStorage.setItem('water_sort_level', currentLevel);
            initGame();
        }

        function nextLevel() {
            currentLevel++;
            localStorage.setItem('water_sort_level', currentLevel);
            initGame();
        }

        function checkIfWon(currentState) {
            for (let tube of currentState) {
                if (tube.length > 0) {
                    if (tube.length !== TUBE_CAPACITY) return false;
                    let firstColor = tube[0];
                    for (let color of tube) {
                        if (color !== firstColor) return false;
                    }
                }
            }
            return true;
        }

        window.onload = () => {
            initGame();
        };
    </script>
